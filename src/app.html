<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Sites with hotlink protection (e.g. darkscene.org) reject image requests that
		     carry a foreign Referer, breaking thumbnails and article images. Suppress it
		     document-wide: {@html} content images can't take a per-tag referrerpolicy. -->
		<meta name="referrer" content="no-referrer" />
		<link rel="icon" href="data:," />
		<title>Miniflux Reader</title>
		<!-- Anti-FOUC: apply the active theme's resolved CSS variables before first paint.
		     The theme store rewrites 'themeVars' on every init/switch/save; absent or
		     corrupt data degrades to the :root fallback palette in app.css. -->
		<script>
			(function () {
				try {
					var d = JSON.parse(localStorage.getItem('themeVars') || 'null');
					if (d && d.vars) {
						var s = document.documentElement.style;
						for (var k in d.vars) s.setProperty('--' + k, String(d.vars[k]));
						if (d.mode) s.colorScheme = d.mode;
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
